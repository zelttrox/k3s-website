<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enzo Granana - CV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="resume">
        <div class="resume-inner">
            <h1 class="resume-title">Mon <span class="accent">CV</span></h1>
            <p class="resume-desc">Consultez ou téléchargez mon CV ci-dessous.</p>

            <div class="resume-card">
                <div class="resume-card-header">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                    <span class="resume-card-path">~/enzo-granana/cv.pdf</span>
                </div>
                <div class="resume-card-body">
                    <div id="pdf-render" class="resume-pdf">
                        <span class="pdf-loading">Chargement du CV…</span>
                    </div>
                </div>
            </div>

            <a href="resume.pdf" download class="button resume-btn" id="resume-button">
                Télécharger le CV
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M12 2.25a.75.75 0 01.75.75v11.69l3.22-3.22a.75.75 0 111.06 1.06l-4.5 4.5a.75.75 0 01-1.06 0l-4.5-4.5a.75.75 0 111.06-1.06l3.22 3.22V3a.75.75 0 01.75-.75zm-9 13.5a.75.75 0 01.75.75v2.25a1.5 1.5 0 001.5 1.5h13.5a1.5 1.5 0 001.5-1.5V16.5a.75.75 0 011.5 0v2.25a3 3 0 01-3 3H5.25a3 3 0 01-3-3V16.5a.75.75 0 01.75-.75z"
                        clip-rule="evenodd"></path>
                </svg>
            </a>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Render the PDF to canvas with PDF.js — <embed>/<object> aren't
        // supported by mobile browsers (they show "Plug-in not supported").
        (function () {
            const container = document.getElementById('pdf-render');
            if (!container || !window.pdfjsLib) return;

            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            async function renderPdf() {
                try {
                    const pdf = await pdfjsLib.getDocument('resume.pdf').promise;
                    container.innerHTML = '';
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    for (let num = 1; num <= pdf.numPages; num++) {
                        const page = await pdf.getPage(num);
                        const unscaled = page.getViewport({ scale: 1 });
                        const scale = container.clientWidth / unscaled.width;
                        const viewport = page.getViewport({ scale: scale * dpr });

                        const canvas = document.createElement('canvas');
                        canvas.className = 'pdf-page';
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        container.appendChild(canvas);

                        await page.render({
                            canvasContext: canvas.getContext('2d'),
                            viewport,
                        }).promise;
                    }
                } catch (err) {
                    console.error('[CV] Failed to render PDF', err);
                    container.innerHTML =
                        '<a href="resume.pdf" class="pdf-fallback" target="_blank" rel="noopener">Ouvrir le CV en plein écran</a>';
                }
            }

            renderPdf();
            // Re-render on resize so the pages stay crisp at the new width
            let resizeTimer;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(renderPdf, 250);
            });
        })();
    </script>

</body>
</html>
