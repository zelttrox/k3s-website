apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portfolio-web
  template:
    metadata:
      labels:
        app: portfolio-web
    spec:
      containers:
      - name: web
        image: website:latest
        ports:
        - containerPort: 3030
        env:
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: portfolio-secrets
              key: github-token
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
spec:
  selector:
    app: portfolio-web
  ports:
  - port: 80
    targetPort: 3030
  type: LoadBalancer