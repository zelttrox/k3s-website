---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: website
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-resume-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: website-resume-pods
subjects:
  - kind: ServiceAccount
    name: website
roleRef:
  kind: Role
  name: website-resume-pods
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
spec:
  replicas: 3
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      serviceAccountName: website
      containers:
        - name: website
          image: website:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3030
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: website
                  key: github-token
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"